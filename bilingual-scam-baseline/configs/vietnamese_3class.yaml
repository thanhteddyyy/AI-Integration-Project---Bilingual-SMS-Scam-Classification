seed: 42

paths:
  processed_dir: data/processed_vi_3class
  reports_dir: reports/vietnamese_3class
  artifacts_dir: artifacts/vietnamese_3class

data:
  language: vi
  min_clean_characters: 1
  class_order: [legitimate, spam, scam]
  test_dataset: spamscam_test
  # social_spam_post removed (2026-11-24): it is a machine translation of the English
  # UCI SMS Spam Collection, which is also in the English sms_phishing train data
  # (cross-lingual leakage). The raw file stays in data/raw/ for reference.
  # vie_sms_corpus is split 50/50 by template family (scripts/apply_vi_labels_v3.py, 2026-11-25):
  # the 'holdout' half is the locked external test; the 'dev' half may join train/validation
  # (experiments in configs/experiments/). Never tune on vie_sms_holdout.
  external_dataset: [vie_sms_holdout, vi_crawl]
  drop_exact_duplicates: true
  # v3 labels (2026-11-25): produced by scripts/apply_vi_labels_v3.py from data/review/*.
  # Train = Tuan's train minus rows sharing a template family with Tuan's test (option B).
  # Old keyword labels: data/raw/*_spamscam_reannotated.csv (kept for comparison only).
  extra_datasets:
    - name: spamscam_train
      path: data/raw/train_dataset_spamscam_v3.csv
      text_column: message
      label_column: label_3class
      scam_type_column: scam_type
      language: vi
      encoding: utf-8-sig
      label_mapping:
        legitimate: legitimate
        spam: spam
        scam: scam
    - name: spamscam_test
      path: data/raw/test_dataset_spamscam_v3.csv
      text_column: message
      label_column: label_3class
      scam_type_column: scam_type
      language: vi
      encoding: utf-8-sig
      label_mapping:
        legitimate: legitimate
        spam: spam
        scam: scam
    # 2026-11-25 (experiment e2): half of vie_sms_corpus joins train/validation so the model sees
    # personal messages; without it 24% of real ham was flagged as scam.
    - name: vie_sms_dev
      path: data/raw/vie_sms_corpus_dev_v3.csv
      text_column: text
      label_column: label_3class
      language: vi
      encoding: utf-8-sig
      label_mapping:
        legitimate: legitimate
        spam: spam
    - name: vie_sms_holdout
      path: data/raw/vie_sms_corpus_holdout_v3.csv
      text_column: text
      label_column: label_3class
      language: vi
      encoding: utf-8-sig
      label_mapping:
        legitimate: legitimate
        spam: spam
    # Real scam SMS from news articles (crawl), built by scripts/build_vi_crawl_external.py.
    # Report its scam recall separately from vie_sms_corpus (FPR) – see metrics "by_source".
    - name: vi_crawl
      path: data/raw/vi_crawl_external.csv
      text_column: message
      label_column: label_3class
      scam_type_column: scam_type
      language: vi
      encoding: utf-8-sig
      label_mapping:
        legitimate: legitimate
        spam: spam
        scam: scam

deduplication:
  mask_urls: true
  mask_emails: true
  mask_numbers: true
  template_min_characters: 12
  fuzzy_enabled: true
  fuzzy_min_characters: 30
  fuzzy_threshold: 0.95
  fuzzy_max_candidates_per_bucket: 120
  # 2026-11-25: whole template families (word 3-gram Jaccard >= 0.5) stay in one split
  family_jaccard: 0.5

split:
  train_fraction: 0.85
  validation_fraction: 0.15
  test_fraction: 0.0
  test_overlap_policy: exclude_development
  external_overlap_policy: exclude_development
  label_conflict_policy: exclude

models:
  naive_bayes:
    word_ngram_range: [1, 2]
    min_df: 2
    max_df: 0.995
    max_features: 60000
    sublinear_tf: true
    alpha: 0.5
    fit_prior: false  # unbalanced real data; uniform prior like class_weight=balanced
  svm:
    word_ngram_range: [1, 2]
    char_ngram_range: [3, 5]
    min_df: 2
    max_df: 0.995
    word_max_features: 60000
    char_max_features: 100000
    sublinear_tf: true
    C: 1.0
    class_weight: balanced
  charcnn:
    max_length: 256
    max_vocab_size: 512
    min_char_frequency: 1
    embedding_dim: 64
    channels: 128
    kernels: [3, 4, 5, 7]
    dropout: 0.35
    batch_size: 64
    epochs: 15
    lr: 0.001
    weight_decay: 0.0001
    patience: 3

