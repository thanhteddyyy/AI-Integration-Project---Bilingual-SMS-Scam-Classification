[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bilingual-scam-baseline"
version = "0.1.0"
description = "Leakage-aware English baseline for bilingual SMS scam detection"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "joblib>=1.3,<2",
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "PyYAML>=6,<7",
  "scikit-learn>=1.4,<2",
]

[project.optional-dependencies]
deep = ["torch>=2.2,<3"]

[project.scripts]
scam-baseline = "scam_baseline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

